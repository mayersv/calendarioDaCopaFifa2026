name: Auto-Update Fifa 2026 Scores

on:
  schedule:
    # Rodar a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite execução manual pelo botão no GitHub

jobs:
  update-scores:
    runs-on: ubuntu-latest

    permissions:
      # Permissões necessárias para commitar e dar push de volta para o repo
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Run score updater
      run: |
        python update_scores.py

    - name: Commit and push changes
      run: |
        git config --global user.name "FIFA 2026 Score Updater"
        git config --global user.email "bot@copa2026.info"
        git add matches.js log.txt
        if git diff --staged --quiet; then
          echo "Nenhuma alteração detectada nos placares ou logs."
        else
          git commit -m "Auto-update: placares das partidas [Bot]"
          git pull --rebase
          git push
        fi
